<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="fintrack-api-base" content="">
  <title>Reset Password - FinTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="landing.html">FinTrack<span>.</span></a>

    <section class="auth-panel">
      <form class="auth-form active" id="resetPasswordForm">
        <div class="auth-heading">
          <h1>Choose a new password</h1>
          <p>Your new password must be at least 8 characters.</p>
        </div>

        <label for="resetPassword">New password</label>
        <div class="password-field">
          <input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="resetPassword" aria-label="Show password">Show</button>
        </div>

        <label for="resetPasswordConfirm">Confirm password</label>
        <div class="password-field">
          <input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="resetPasswordConfirm" aria-label="Show password">Show</button>
        </div>

        <button class="auth-submit" type="submit">Update password</button>
        <p class="auth-message" id="resetMessage" role="status"></p>
        <a class="auth-back" href="login.html">Back to login</a>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
