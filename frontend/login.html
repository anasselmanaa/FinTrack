<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="fintrack-api-base" content="">
  <title>Log In - FinTrack</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="landing.html">FinTrack<span>.</span></a>

    <section class="auth-panel">
      <div class="auth-tabs" role="tablist" aria-label="Authentication">
        <button class="auth-tab active" id="loginTab" type="button">Log in</button>
        <button class="auth-tab" id="registerTab" type="button">Start trial</button>
      </div>

      <form class="auth-form active" id="loginForm">
        <div class="auth-heading">
          <h1>Welcome back</h1>
          <p>Sign in to your FinTrack account.</p>
        </div>

        <a class="auth-google" href="/auth/google">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          <span>Continue with Google</span>
        </a>

        <div class="auth-divider"><span>or</span></div>

        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required>

        <div class="auth-label-row">
          <label for="loginPassword">Password</label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <div class="password-field">
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-toggle-password="loginPassword" aria-label="Show password">Show</button>
        </div>

        <button class="auth-submit" type="submit">Log in</button>
        <p class="auth-message" id="loginMessage" role="status"></p>
      </form>

      <form class="auth-form" id="registerForm">
        <div class="auth-heading">
          <h1>Start your 14 days</h1>
          <p>No card needed. Create your account and start tracking.</p>
        </div>

        <a class="auth-google" href="/auth/google">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          <span>Continue with Google</span>
        </a>

        <div class="auth-divider"><span>or</span></div>

        <label for="registerName">Name</label>
        <input id="registerName" type="text" autocomplete="name" required>

        <label for="registerEmail">Email</label>
        <input id="registerEmail" type="email" autocomplete="email" required>

        <label for="registerPassword">Password</label>
        <div class="password-field">
          <input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="registerPassword" aria-label="Show password">Show</button>
        </div>

        <label for="registerPasswordConfirm">Confirm password</label>
        <div class="password-field">
          <input id="registerPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="registerPasswordConfirm" aria-label="Show password">Show</button>
        </div>

        <button class="auth-submit" type="submit">Create account</button>
        <p class="auth-message" id="registerMessage" role="status"></p>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
