<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="fintrack-api-base" content="">
  <title>Log In - FinTrack</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="landing.html">FinTrack<span>.</span></a>

    <section class="auth-panel">
      <div class="auth-tabs" role="tablist" aria-label="Authentication">
        <button class="auth-tab active" id="loginTab" type="button">Log in</button>
        <button class="auth-tab" id="registerTab" type="button">Start trial</button>
      </div>

      <form class="auth-form active" id="loginForm">
        <div class="auth-heading">
          <h1>Welcome back</h1>
          <p>Sign in to your FinTrack account.</p>
        </div>

        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required>

        <div class="auth-label-row">
          <label for="loginPassword">Password</label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <div class="password-field">
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-toggle-password="loginPassword" aria-label="Show password">Show</button>
        </div>

        <button class="auth-submit" type="submit">Log in</button>
        <p class="auth-message" id="loginMessage" role="status"></p>
      </form>

      <form class="auth-form" id="registerForm">
        <div class="auth-heading">
          <h1>Start your 14 days</h1>
          <p>No card needed. Create your account and start tracking.</p>
        </div>

        <label for="registerName">Name</label>
        <input id="registerName" type="text" autocomplete="name" required>

        <label for="registerEmail">Email</label>
        <input id="registerEmail" type="email" autocomplete="email" required>

        <label for="registerPassword">Password</label>
        <div class="password-field">
          <input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="registerPassword" aria-label="Show password">Show</button>
        </div>

        <label for="registerPasswordConfirm">Confirm password</label>
        <div class="password-field">
          <input id="registerPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-toggle-password="registerPasswordConfirm" aria-label="Show password">Show</button>
        </div>

        <button class="auth-submit" type="submit">Create account</button>
        <p class="auth-message" id="registerMessage" role="status"></p>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
