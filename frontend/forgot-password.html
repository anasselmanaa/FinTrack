<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="fintrack-api-base" content="">
  <title>Forgot Password - FinTrack</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="landing.html">FinTrack<span>.</span></a>

    <section class="auth-panel">
      <form class="auth-form active" id="forgotPasswordForm">
        <div class="auth-heading">
          <h1>Reset your password</h1>
          <p>Enter your account email and we will send a reset link if it exists.</p>
        </div>

        <label for="forgotEmail">Email</label>
        <input id="forgotEmail" type="email" autocomplete="email" required>

        <button class="auth-submit" type="submit">Send reset link</button>
        <p class="auth-message" id="forgotMessage" role="status"></p>
        <a class="auth-back" href="login.html">Back to login</a>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
